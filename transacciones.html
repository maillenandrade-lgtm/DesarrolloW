<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transacciones - Casino Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="diseñoDePágina.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a;">
        <div class="container-fluid">
            <a class="navbar-brand" href="panelUsuario.html" style="color: #e43f5a; font-weight: bold;">Casino Online</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="panelUsuario.html">Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="ruleta.html">Ir a la Ruleta</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container casino-container text-center">
        <header class="mb-4">
            <h1>Cajero Virtual</h1>
        </header>

        <main>
            <p class="saldo-box mb-5"><strong>Saldo Actual:</strong> <span id="saldoUsuario">1000</span> fichas</p>

            <div class="row justify-content-center">
                <div class="col-md-5 form-container mx-2 mb-3">
                    <h3>Depositar Fichas</h3>
                    <form id="formDeposito">
                        <div class="mb-3 text-start">
                            <label for="deposito" class="form-label">Monto a depositar:</label>
                            <input type="number" class="form-control" id="deposito" placeholder="Ej: 500" required min="1">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Depositar</button>
                    </form>
                </div>
                
                <div class="col-md-5 form-container mx-2 mb-3">
                    <h3>Retirar Fichas</h3>
                    <form id="formRetiro">
                        <div class="mb-3 text-start">
                            <label for="retiro" class="form-label">Monto a retirar:</label>
                            <input type="number" class="form-control" id="retiro" placeholder="Ej: 100" required min="1">
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Retirar</button>
                    </form>
                </div>
            </div>
            
            <div id="mensajeExito" class="alert alert-success d-none mt-4 w-50 mx-auto" role="alert">
                Transacción realizada con éxito.
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="transacciones.js"></script>
</body>
</html>
